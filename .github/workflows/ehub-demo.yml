  name: Update ISD Meeting Ehub

  on:
    push:
      branches:
        - ehub

  jobs:
    update:
      runs-on: ubuntu-latest
      
      steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Deploy isd_meeting to Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EHUB_HOST }}
          username: ${{ secrets.EHUB_USERNAME }}
          key: ${{ secrets.EHUB_SSH_KEY }}
          script_stop: true
          script: |
            # Clone if not exists, otherwise update
            if [ ! -d /opt/addons-system/isd_meeting ]; then
              sudo mkdir -p /opt/addons-system
              sudo chown odoo:odoo /opt/addons-system
              sudo -u odoo git clone git@github-odoo:IntelliSync-data/isd_meeting.git /opt/addons-system/isd_meeting
              cd /opt/addons-system/isd_meeting && git checkout ehub
            else
              # ubuntu only have permission to run git commands, so we need to use sudo -u odoo to run git commands as odoo user
              sudo -u odoo bash -c "cd /opt/addons-system/isd_meeting && git fetch origin && git reset --hard origin/ehub" 
            fi

            # Sync isd_meeting directory with rsync (including deletions)
            sudo mkdir -p /opt/custom-addons/isd_meeting
            sudo rsync -av --delete \
              /opt/addons-system/isd_meeting/ /opt/custom-addons/isd_meeting/

      - name: Update isd_meeting Module
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EHUB_HOST }}
          username: ${{ secrets.EHUB_USERNAME }}
          key: ${{ secrets.EHUB_SSH_KEY }}
          script: |
            echo "Updating apps list..."
            echo "env['ir.module.module'].update_list(); env.cr.commit()" | sudo -u odoo /opt/odoo-venv/bin/python /opt/odoo18/odoo-bin shell -c /etc/odoo/odoo.conf -d ${{ secrets.EHUB_DB_NAME }} --no-http
            # A module that is not installed yet is skipped by -u: install it once from Apps
            echo "Updating isd_meeting module..."
            sudo -u odoo /opt/odoo-venv/bin/python /opt/odoo18/odoo-bin -c /etc/odoo/odoo.conf -d ${{ secrets.EHUB_DB_NAME }} -u isd_meeting --stop-after-init --no-http
            if [ $? -ne 0 ]; then
              echo "Module update FAILED, last lines of the Odoo log:"
              sudo tail -n 60 /var/log/odoo/odoo.log
              exit 1
            fi

      - name: Restart Odoo Service
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EHUB_HOST }}
          username: ${{ secrets.EHUB_USERNAME }}
          key: ${{ secrets.EHUB_SSH_KEY }}
          script: |
            sudo systemctl restart odoo

      - name: Verify Odoo Service
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EHUB_HOST }}
          username: ${{ secrets.EHUB_USERNAME }}
          key: ${{ secrets.EHUB_SSH_KEY }}
          script: |
            sleep 5
            if sudo systemctl is-active --quiet odoo; then
              echo "Odoo restarted successfully"
            else
              echo "Odoo failed to restart"
              echo "=== systemctl status ==="
              sudo systemctl status odoo --no-pager
              echo "=== Last 50 lines of Odoo log ==="
              sudo tail -n 50 /var/log/odoo/odoo.log
              exit 1
            fi